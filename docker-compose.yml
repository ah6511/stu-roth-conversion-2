services:
  web:
    build:
      context: .
      target: runtime
    image: stu-roth-conversion:latest
    container_name: stu-roth-conversion
    ports:
      # Bound to localhost only; change HOST_BIND to 0.0.0.0 to expose externally
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-8000}:8000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - app-net
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# No external services (DB/cache) are required: the simulator is stateless.
networks:
  app-net:
    driver: bridge
